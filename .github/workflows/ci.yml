# Adapted from OpenRAModSDK; prototype validation, 2026-10-23.
name: Frontier validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.428
            8.0.426
      - name: Verify pinned SDK
        run: |
          test "$(dotnet --version)" = "8.0.426"
          dotnet --info
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r tools/requirements.txt
      - run: make
      - run: ./tools/check.sh
      - run: make check
      - run: python3 tools/check-dependencies.py
      # make check writes Debug DLLs into the shared engine/bin directory.
      # Exercise the Release build that developers launch after `make`.
      - name: Restore Release gameplay binaries
        run: make
      - name: Desktop gameplay smoke
        timeout-minutes: 25
        run: xvfb-run -a -s "-screen 0 1280x800x24" python3 tools/smoke-desktop.py
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-${{ github.sha }}
          path: |
            .runtime/ci-desktop-smoke.log
            .runtime/ci-desktop-smoke.png
          if-no-files-found: warn
