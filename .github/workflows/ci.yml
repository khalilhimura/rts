# Adapted from OpenRAModSDK; prototype validation, 2026-10-23.
name: Frontier validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.428
            8.0.426
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r tools/requirements.txt
      - run: make
      - run: ./tools/check.sh
      # Retain the pinned engine's NU1901 advisory as a warning; all code style
      # diagnostics remain errors. The stock `make check` fails on this advisory.
      - run: dotnet build Frontier.sln -c Debug --no-restore -warnaserror -warnnotaserror:NU1901
