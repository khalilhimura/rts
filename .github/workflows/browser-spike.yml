name: Frontier browser validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426
      - run: test "$(dotnet --version)" = "8.0.426"
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r browser/requirements-test.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tools/build-browser-world.py
      - run: python3 tools/check-browser-content.py
      - run: python3 tools/check-browser-style.py
      - run: python3 tools/check-browser-dependencies.py
      - run: python3 tools/build-browser-probe.py --skip-engine-build
      - run: python3 tools/test-browser-probe.py
      - name: Actual browser skirmish and lifecycle acceptance under /rts/
        timeout-minutes: 35
        run: python3 tools/smoke-browser-world.py --full-gameplay
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-validation-${{ github.sha }}
          path: |
            .runtime/browser-world-evidence
            .runtime/browser-world/world-build.json
            .runtime/browser-evidence
          if-no-files-found: warn
      - name: Package subpath deployment artifact
        run: python3 tools/package-browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: rts-site-${{ github.event.pull_request.head.sha || github.sha }}
          path: .runtime/rts-site.zip
